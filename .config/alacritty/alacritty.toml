[window]
opacity = 0.9  # Adjust value from 0.0 (fully transparent) to 1.0 (opaque)
padding = { x = 8, y = 8}

[font]
normal = { family = "DejaVu Sans Mono" }
bold = { family = "DejaVu Sans Mono" }
italic = { family = "DejaVu Sans Mono" }
bold_italic = { family = "DejaVu Sans Mono"}
size = 9

[keyboard]
bindings = [
  { key = "J", mods = "Control", action = "ScrollLineDown" },
  { key = "K", mods = "Control", action = "ScrollLineUp" },
]

#[terminal.shell]
#program = "/bin/bash"  # or your preferred shell
#args = ["-l", "-c", "tmux"]


