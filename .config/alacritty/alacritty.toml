[window]
padding = { x = 8, y = 8}

[font]
normal = { family = "JetBrainsMono Nerd Font Mono" }
bold = { family = "JetBrainsMono Nerd Font Mono" }
italic = { family = "JetBrainsMono Nerd Font Mono" }
bold_italic = { family = "JetBrainsMono Nerd Font Mono"}

[keyboard]
bindings = [
  { key = "J", mods = "Control", action = "ScrollLineDown" },
  { key = "K", mods = "Control", action = "ScrollLineUp" },
]

[colors.primary]
background = "#181818"
foreground = "#e4e4ef"

[colors.normal]
black = "#181818"
red = "#f43841"
green = "#73c936"
yellow = "#fcf75e"
blue = "#96a6c8"
magenta = "#e4e4ef"
cyan = "#95a99f"
white = "#e4e4ef"

[colors.bright]
black = "#3a3a3a"
red = "#f43841"
green = "#73c936"
yellow = "#fcf75e"
blue = "#96a6c8"
magenta = "#e4e4ef"
cyan = "#95a99f"
white = "#e4e4ef"

[colors.selection]
text = "CellForeground"
background = "#292929"

[colors.cursor]
text = "CellBackground"
cursor = "#ffdd33"
